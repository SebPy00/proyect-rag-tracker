name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm test && npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_DB: tracker_test, POSTGRES_USER: tracker_test, POSTGRES_PASSWORD: test-only-password }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U tracker_test -d tracker_test" --health-interval 5s --health-retries 10
    env:
      DEBUG: 'false'
      DJANGO_SECRET_KEY: ci-only-0000000000000000000000000000000000000000000000000
      POSTGRES_NAME: tracker_test
      POSTGRES_USER: tracker_test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_HOST: 127.0.0.1
      ALLOWED_HOSTS: localhost,testserver
      AI_ENABLED: 'false'
      EMBEDDINGS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py test api
      - name: Check initial LAN deployment (expected security.W004)
        run: python backend/manage.py check --deploy --fail-level ERROR
      # A hypothetical fully opted-in profile preserves the strict gate for
      # other security warnings. These CI-only flags are NOT deployment defaults.
      - name: Check deployment with explicit full HSTS opt-in
        run: python backend/manage.py check --deploy --fail-level WARNING
        env:
          SECURE_HSTS_SECONDS: '3600'
          SECURE_HSTS_INCLUDE_SUBDOMAINS: 'true'
          SECURE_HSTS_PRELOAD: 'true'
      - run: docker compose -f compose.prod.yml config --quiet
        env:
          DB_PASS: test-only-password
          CSRF_TRUSTED_ORIGINS: https://localhost
